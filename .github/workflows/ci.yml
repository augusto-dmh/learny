# CI gates for every PR and main push (RFC-002 Cycle A).
#
# Four parallel jobs mirroring the local gates:
#   backend-test — pytest against real Postgres(pgvector)+Redis service containers;
#                  the suite's own bootstrap applies Alembic migrations, so every
#                  run also proves migrations work from an empty database.
#   lint         — ruff check + ruff format --check (formatting enforced since the
#                  repo-wide reformat) + architecture boundary fitness check.
#   frontend     — vitest, tsc, and the production Next.js build.
#   compose-smoke— builds the compose topology and boots it to a healthy API.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every job only reads the repository; keep the workflow token least-privilege.
permissions:
  contents: read

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: learny
          POSTGRES_PASSWORD: learny
          POSTGRES_DB: learny_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      # The web-layer upload tests and the storage adapter integration tests run
      # end-to-end against a real S3 endpoint. GitHub service containers cannot
      # pass an image command (which minio/minio requires), so start the official
      # image — same pinned tag as the production overlay — as a plain container.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=learny -e MINIO_ROOT_PASSWORD=learny-dev-secret \
            minio/minio:RELEASE.2024-10-13T13-34-11Z server /data
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"
      - run: uv python install
      # Install the dev extra only — never the `pdf` extra: docling pulls torch
      # (~GB, model downloads) and its live conversion tests skip without it, so
      # CI stays offline and fast (AD-089 / CI parity). The docling-core mapping
      # tests run from the dev extra alone.
      - run: uv sync --locked --extra dev
      - name: Wait for MinIO to accept requests
        run: timeout 60 bash -c 'until curl -fsS http://localhost:9000/minio/health/live; do sleep 2; done'
      - run: uv run pytest -q
        env:
          LEARNY_TEST_DATABASE_URL: postgresql+psycopg://learny:learny@localhost:5432/learny_test
          LEARNY_REDIS_URL: redis://localhost:6379/0
          LEARNY_STORAGE_ENDPOINT: http://localhost:9000
          LEARNY_STORAGE_ACCESS_KEY: learny
          LEARNY_STORAGE_SECRET_KEY: learny-dev-secret

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          src: backend
          # Lint with the exact ruff the lockfile pins, not a floating latest.
          version-file: backend/uv.lock
      - uses: astral-sh/ruff-action@v3
        with:
          src: backend
          args: format --check
          version-file: backend/uv.lock
      # Architecture fitness: provider-SDK isolation and layer boundaries as
      # executable rules (stdlib-only script), not just review prose.
      - name: Check architecture boundaries
        run: python3 backend/scripts/check_boundaries.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx vitest run
      - run: npx tsc --noEmit
      - run: npm run build

  compose-smoke:
    runs-on: ubuntu-latest
    # Local development runs with WAL archiving off (docker-compose.override.yml
    # explains why: no base backup is ever taken there, so the segments can neither
    # be replayed nor pruned). The point-in-time drill below needs a real archive, so
    # this job opts in exactly as an operator rehearsing a restore would.
    env:
      LEARNY_WAL_ARCHIVE_MODE: "on"
    steps:
      - uses: actions/checkout@v4
      # One build-and-boot step: `--wait` blocks until EVERY named service's
      # healthcheck passes (api /healthz, worker celery ping, web fetch probe,
      # db/redis/minio) and fails the job otherwise — a strictly stronger gate
      # than polling one endpoint. Plain compose build (no bake): api and worker
      # share an identical build definition, which bake dedupes into a single tag,
      # leaving the worker's expected image name missing at `up` time.
      #
      # worker-pdf is named out deliberately: its pdf-worker image bakes docling +
      # torch + models (multi-GB, minutes, network) — far beyond a smoke test. Its
      # topology is asserted at the YAML/config level in test_compose_topology.py;
      # building it is deferred to deploy.
      - name: Build and boot the full topology
        run: docker compose up -d --build --wait --wait-timeout 300 db redis minio api worker web
      # Prove the shipped backup image end-to-end (OPS-10) against the db/minio just
      # booted above: seed a marker row, back it up, destroy it, restore from the
      # latest dump, and assert the row returns. The backup service is profile-gated,
      # so it never joined the `up` set; `run --rm` drives it on demand. No offsite
      # vars are set, so this also asserts the local-only "offsite not configured"
      # notice.
      - name: Build the backup image
        run: docker compose --profile backup build backup
      - name: Seed a backup marker row
        run: |
          docker compose exec -T db psql -U learny -d learny -v ON_ERROR_STOP=1 \
            -c "CREATE TABLE backup_marker (id int PRIMARY KEY, note text);" \
            -c "INSERT INTO backup_marker (id, note) VALUES (1, 'roundtrip');"
      - name: Back up now (local-only, asserts the offsite notice)
        run: |
          out="$(docker compose --profile backup run --rm backup backup-now 2>&1)"
          echo "$out"
          echo "$out" | grep -qF "offsite not configured"
      - name: Destroy the seeded data
        run: |
          docker compose exec -T db psql -U learny -d learny -v ON_ERROR_STOP=1 \
            -c "DROP TABLE backup_marker;"
      - name: Restore from the latest dump
        run: docker compose --profile backup run --rm backup restore.sh --latest --yes
      - name: Assert the seeded row is back
        run: |
          docker compose exec -T db psql -U learny -d learny -tAc \
            "SELECT note FROM backup_marker WHERE id = 1;" | grep -qF roundtrip
      # The roundtrip above exercised the default (local-only) path. Now prove the
      # offsite branch (mc cp of the dump + mc mirror of the source bucket) actually
      # runs, by pointing the four LEARNY_BACKUP_REMOTE_* vars at the same MinIO and a
      # scratch offsite bucket. Seed one source object first so the mirror has something
      # to copy; the backup image ships mc, so drive it through that image.
      - name: Seed a source object for the offsite mirror
        run: |
          docker compose --profile backup run --rm --no-deps backup sh -c '
            mc alias set m http://minio:9000 learny learny-dev-secret &&
            mc mb --ignore-existing m/learny-sources &&
            echo offsite-mirror-probe | mc pipe m/learny-sources/offsite-probe.txt'
      - name: Back up now (offsite mode, asserts the branch runs)
        run: |
          out="$(docker compose --profile backup run --rm \
            -e LEARNY_BACKUP_REMOTE_ENDPOINT=http://minio:9000 \
            -e LEARNY_BACKUP_REMOTE_ACCESS_KEY=learny \
            -e LEARNY_BACKUP_REMOTE_SECRET_KEY=learny-dev-secret \
            -e LEARNY_BACKUP_REMOTE_BUCKET=learny-offsite-ci \
            backup backup-now 2>&1)"
          echo "$out"
          echo "$out" | grep -qF "offsite configured; copying dump and mirroring objects"
          if echo "$out" | grep -qF "offsite not configured"; then
            echo "offsite branch did not run (saw the local-only notice)"; exit 1
          fi
      - name: Assert the dump and mirrored objects landed offsite
        run: |
          docker compose --profile backup run --rm --no-deps backup sh -c '
            mc alias set m http://minio:9000 learny learny-dev-secret &&
            mc ls --recursive m/learny-offsite-ci/db/ | grep -qF .dump &&
            mc ls --recursive m/learny-offsite-ci/objects/ | grep -qF offsite-probe.txt'
      # Point-in-time recovery, proven rather than asserted (PITR-09). A drill that
      # seeds data, restores, and finds it again passes just as happily against a
      # plain whole-archive restore — it proves nothing about recovering to a MOMENT.
      # So this one establishes a before and an after around a recorded target and
      # checks both directions: the row written before it must return, and the row
      # written after it must NOT. The second half is the assertion that carries the
      # whole claim, and the control step below exists to prove it can fail.
      - name: Take the physical base a replay starts from
        run: docker compose --profile backup run --rm backup base-backup.sh
      - name: The recorded replay floor never sits past the base's own start
        run: |
          # WAL retention is derived from START_WAL, and the job reads it from the
          # server BEFORE the copy rather than out of the finished tarball. That is
          # only safe in one direction: a floor EARLIER than the base's real start
          # retains more WAL than needed, while a floor past it prunes segments the
          # base needs to replay and leaves it unrecoverable. This compares the
          # recorded floor against the base's own backup_label every run.
          docker compose --profile backup run --rm --no-deps backup sh -c '
            set -eu
            base="$(ls -1d /backups/base/learny-base-* | sort | tail -n1)"
            recorded="$(cat "$base/START_WAL")"
            label="$(tar -xzOf "$base/base.tar.gz" backup_label |
              sed -n "s/^START WAL LOCATION: .*(file \([0-9A-F]\{24\}\))$/\1/p")"
            echo "recorded floor=$recorded  base label=$label"
            if [ -z "$label" ]; then
              echo "could not read the base label; the comparison proves nothing"; exit 1
            fi
            # Fixed-width hex, so a string compare is a WAL-order compare.
            if [ "$recorded" \> "$label" ]; then
              echo "the recorded floor is LATER than the base start:"
              echo "WAL this base needs to replay would be eligible for pruning"
              exit 1
            fi'
      - name: Write a boundary into the WAL and record it
        run: |
          q() {
            docker compose exec -T db psql -U learny -d learny -v ON_ERROR_STOP=1 "$@" | tr -d '\r'
          }
          q -c "CREATE TABLE pitr_marker (id int PRIMARY KEY, note text);" \
            -c "INSERT INTO pitr_marker VALUES (1, 'before-target');"
          # Whole seconds apart so the boundary is unambiguous at psql's precision.
          q -c "SELECT pg_sleep(2);"
          # UTC with an explicit offset: recovery_target_time is read in the server's
          # timezone when the value carries none, which would make this boundary mean
          # a different moment than the one just written.
          target="$(q -tAc \
            "SELECT to_char(clock_timestamp() AT TIME ZONE 'UTC','YYYY-MM-DD HH24:MI:SS.US')||'+00:00';")"
          q -c "SELECT pg_sleep(2);"
          q -c "INSERT INTO pitr_marker VALUES (2, 'after-target');"
          q -c "SELECT pg_sleep(2);"
          control="$(q -tAc \
            "SELECT to_char(clock_timestamp() AT TIME ZONE 'UTC','YYYY-MM-DD HH24:MI:SS.US')||'+00:00';")"
          q -c "SELECT pg_sleep(2);"
          # Recovery confirms it reached a target by seeing a committed record PAST it,
          # so the control target below needs a write after it or replay would run out
          # of WAL and refuse to finish.
          q -c "INSERT INTO pitr_marker VALUES (3, 'after-control');"
          # WAL reaches the archive only when a segment COMPLETES. Force the switch and
          # then wait for the segment to actually land, rather than assuming it did —
          # a restore that replays nothing would otherwise look like a stale archive.
          segment="$(q -tAc "SELECT pg_walfile_name(pg_current_wal_lsn());")"
          q -tAc "SELECT pg_switch_wal();"
          landed=0
          for _ in $(seq 30); do
            if docker compose exec -T db test -f "/wal_archive/$segment"; then landed=1; break; fi
            q -c "SELECT pg_sleep(1);" > /dev/null
          done
          if [ "$landed" -ne 1 ]; then
            echo "segment $segment never reached the archive; there is nothing to replay"
            docker compose exec -T db psql -U learny -d learny -c "SELECT * FROM pg_stat_archiver;"
            exit 1
          fi
          echo "PITR_TARGET=$target" >> "$GITHUB_ENV"
          echo "PITR_CONTROL=$control" >> "$GITHUB_ENV"
      - name: A point-in-time restore refuses to act without --yes
        run: |
          out="$(docker compose --profile backup run --rm backup \
            restore-pitr.sh --target "$PITR_TARGET" 2>&1)" && rc=0 || rc=$?
          echo "$out"
          if [ "$rc" -eq 0 ]; then echo "the dry run must exit non-zero"; exit 1; fi
          echo "$out" | grep -qF "nothing was changed"
          # Inert, not merely stopped short of the last step: no data directory exists.
          docker compose --profile backup run --rm --no-deps backup sh -c 'test ! -e /pitr/data'
      - name: A target below the window names the earliest recoverable time
        run: |
          out="$(docker compose --profile backup run --rm --no-deps backup \
            restore-pitr.sh --target '2000-01-01 00:00:00+00:00' --yes 2>&1)" && rc=0 || rc=$?
          echo "$out"
          if [ "$rc" -eq 0 ]; then echo "an unreachable target must exit non-zero"; exit 1; fi
          echo "$out" | grep -qF "earliest recoverable time"
          docker compose --profile backup run --rm --no-deps backup sh -c 'test ! -e /pitr/data'
      - name: A target the validation cannot pin down is refused, staging nothing
        run: |
          # Both refusals executed rather than matched in the script's source. A
          # rewrite that quietly accepted a bare timestamp keeps every pinned string
          # and yields a restore that succeeds loudly on the WRONG moment, read in the
          # server's timezone; one that accepted trailing content writes it verbatim
          # into the single-quoted recovery_target_time in postgresql.auto.conf, where
          # a crafted value can append its own directives — restore_command among
          # them, which the server runs through a shell.
          refuse() {
            out="$(docker compose --profile backup run --rm --no-deps backup \
              restore-pitr.sh --target "$1" --yes 2>&1)" && rc=0 || rc=$?
            echo "$out"
            if [ "$rc" -ne 2 ]; then
              echo "expected exit 2 for [$1], got $rc"; exit 1
            fi
            echo "$out" | grep -qF "$2"
          }
          refuse '2026-08-02 12:00:00' 'target carries no UTC offset'
          refuse "2026-08-02 12:00:00.1' notatimestamp+00:00" 'unusable fractional-seconds'
          docker compose --profile backup run --rm --no-deps backup sh -c 'test ! -e /pitr/data'
      - name: Restore to the recorded moment
        run: |
          docker compose --profile backup run --rm backup \
            restore-pitr.sh --target "$PITR_TARGET" --yes
          # --wait holds on db-restore's healthcheck, which requires a server OUT of
          # recovery: one still replaying, or paused at its target, answers reads and
          # refuses writes, and that is a failed restore, not a passed one.
          docker compose --profile restore up -d --build --wait --wait-timeout 300 db-restore
      - name: Assert the recovery landed on the moment, not on the whole archive
        run: |
          q() {
            docker compose exec -T db-restore psql -U learny -d learny -tAc "$1" | tr -d '\r'
          }
          if [ "$(q 'SELECT count(*) FROM pitr_marker WHERE id = 1;')" != 1 ]; then
            echo "the row written BEFORE the target is missing — no WAL was replayed"; exit 1
          fi
          if [ "$(q 'SELECT count(*) FROM pitr_marker WHERE id = 2;')" != 0 ]; then
            echo "the row written AFTER the target came back — this is a whole-archive restore"
            exit 1
          fi
          if [ "$(q 'SELECT pg_is_in_recovery();')" != f ]; then
            echo "the restored server is still in recovery"; exit 1
          fi
          docker compose exec -T db-restore psql -U learny -d learny -v ON_ERROR_STOP=1 \
            -c "CREATE TABLE pitr_writable (x int);" -c "DROP TABLE pitr_writable;"
      - name: Prove the boundary moves with the target, not by accident
        run: |
          # Same base, same archive, a LATER target. If the assertion above could not
          # fail — because replay silently stopped early, or never ran — this run would
          # produce the same rows. It must instead bring row 2 back and leave row 3 out.
          docker compose --profile restore rm -sf db-restore
          docker compose --profile backup run --rm backup \
            restore-pitr.sh --target "$PITR_CONTROL" --yes
          docker compose --profile restore up -d --wait --wait-timeout 300 db-restore
          q() {
            docker compose exec -T db-restore psql -U learny -d learny -tAc "$1" | tr -d '\r'
          }
          if [ "$(q 'SELECT count(*) FROM pitr_marker WHERE id = 2;')" != 1 ]; then
            echo "a later target did not bring back the row written after the first one"
            echo "the point-in-time assertion above cannot fail and proves nothing"
            exit 1
          fi
          if [ "$(q 'SELECT count(*) FROM pitr_marker WHERE id = 3;')" != 0 ]; then
            echo "the row written after the control target came back"; exit 1
          fi
      - name: Teardown (with logs on failure)
        if: always()
        run: |
          docker compose --profile backup --profile restore logs --tail 50
          docker compose --profile backup --profile restore down -v
