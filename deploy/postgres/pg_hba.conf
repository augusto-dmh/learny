# Learny client authentication (RFC-005 Cycle E), selected via `-c hba_file=`.
#
# This reproduces the file the stock postgres entrypoint generates and adds ONE
# rule: remote physical replication, under the same scram-sha-256 authentication
# the remote rule already uses.
#
# Why it is needed: PostgreSQL's `all` in the DATABASE column does not match a
# physical replication connection, so the generated `host all all all
# scram-sha-256` line leaves remote replication with no matching rule at all and
# `pg_basebackup` from the backup sidecar is rejected outright.
#
# Why a file rather than an init script: an entry appended to $PGDATA/pg_hba.conf
# by a /docker-entrypoint-initdb.d script would only ever run on a FIRST
# initialisation, silently leaving every already-deployed data directory unable
# to serve a base backup. `hba_file` lives outside PGDATA and applies on restart.
#
# No credential belongs in this file. Remote connections stay on scram-sha-256;
# `trust` appears only for the in-container local socket and loopback, which is
# what the stock image already does and what its entrypoint's own bootstrap uses.

# TYPE  DATABASE        USER            ADDRESS                 METHOD

# Local socket + loopback: unchanged from the stock generated file.
local   all             all                                     trust
host    all             all             127.0.0.1/32            trust
host    all             all             ::1/128                 trust
local   replication     all                                     trust
host    replication     all             127.0.0.1/32            trust
host    replication     all             ::1/128                 trust

# Remote (compose network): password-authenticated, never trust.
host    all             all             all                     scram-sha-256
# The added rule. Physical replication for pg_basebackup, same authentication.
host    replication     all             all                     scram-sha-256
