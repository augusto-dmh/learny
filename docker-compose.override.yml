# Local development overlay (AD-042). Docker Compose auto-loads this file for a
# plain `docker compose up`, so local dev keeps the same behaviour as before the
# base/prod split: db/redis/minio are published on the host, and dev-only
# credentials are supplied here (never committed as real secrets — these are
# throwaway local values). The production run (`-f docker-compose.yml -f
# docker-compose.prod.yml`) does NOT load this file, so prod publishes no infra
# ports and injects secrets via env_file instead (NFR-SEC-003).

services:
  db:
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: learny
    # WAL archiving is OFF for local development, and this is the only difference
    # from the base command (a test pins that, so the rest cannot drift).
    #
    # Archived WAL is only ever useful with a physical base backup to replay onto,
    # and a local stack never takes one: the sidecar that would is behind the
    # `backup` profile. So a plain `docker compose up` produces segments that can
    # never be replayed AND can never be pruned — the retention predicate correctly
    # refuses to delete anything when there is no retained base — which grows the
    # archive volume monotonically for no recoverability at all. Production loads
    # the prod overlay instead of this file and keeps the base file's
    # `archive_mode=on`, where the sidecar runs unprofiled and does prune.
    #
    # CI's point-in-time drill sets LEARNY_WAL_ARCHIVE_MODE=on to opt back in; so
    # can a developer rehearsing a restore.
    command:
      - postgres
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
      - -c
      - archive_mode=${LEARNY_WAL_ARCHIVE_MODE:-off}
      - -c
      - archive_command=test ! -f /wal_archive/%f && cp %p /wal_archive/%f
      - -c
      - archive_timeout=${LEARNY_WAL_ARCHIVE_TIMEOUT:-900}

  redis:
    ports:
      - "6379:6379"

  minio:
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: learny
      MINIO_ROOT_PASSWORD: learny-dev-secret

  api:
    ports:
      - "8000:8000"
    environment:
      LEARNY_DATABASE_URL: postgresql+psycopg://learny:learny@db:5432/learny
      LEARNY_STORAGE_ACCESS_KEY: learny
      LEARNY_STORAGE_SECRET_KEY: learny-dev-secret
      # Mounts the dev instrument route (docs/ops/instrumentation.md). This file
      # is not loaded in production, and the prod overlay never sets the flag, so
      # the surface exists only here. Local runs a single API worker, which is
      # what makes its view of the traffic complete.
      LEARNY_DEV_INSTRUMENT_ENABLED: "true"
      # Mounts the eval-results dashboard behind /dev/evals on the same terms:
      # local only, never set by the prod overlay, refused by a production process.
      LEARNY_DEV_EVAL_DASHBOARD_ENABLED: "true"
      # The default results directory is derived from the *source* layout
      # (judge.py → app/eval → app → backend → repo root), which does not survive
      # into the image: the build context is ./backend, so the module lands at
      # /app/app/eval/judge.py and the default resolves to a /evals/results that
      # was never copied in — evals/ is outside the context. Enabling the surface
      # without this pair would render "no runs found" forever, and silently,
      # since a missing directory is deliberately not an error. So the one
      # environment that turns the dashboard on also mounts what it reads.
      LEARNY_EVAL_RESULTS_DIR: /eval-results
    volumes:
      - ./evals/results:/eval-results:ro
    # Optional local AI-provider keys (git-ignored; see backend/.env.example).
    # `required: false` keeps a keyless clone booting deterministic adapters.
    env_file:
      - path: ./secrets/local-ai.env
        required: false

  web:
    ports:
      - "3000:3000"

  worker:
    environment:
      LEARNY_DATABASE_URL: postgresql+psycopg://learny:learny@db:5432/learny
      LEARNY_STORAGE_ACCESS_KEY: learny
      LEARNY_STORAGE_SECRET_KEY: learny-dev-secret
    env_file:
      - path: ./secrets/local-ai.env
        required: false

  worker-pdf:
    environment:
      LEARNY_DATABASE_URL: postgresql+psycopg://learny:learny@db:5432/learny
      LEARNY_STORAGE_ACCESS_KEY: learny
      LEARNY_STORAGE_SECRET_KEY: learny-dev-secret
    env_file:
      - path: ./secrets/local-ai.env
        required: false

  # Opt-in backup sidecar for local/CI use only (RFC-003 Cycle A). Behind the
  # `backup` profile so a plain `docker compose up` never starts it; drive it with
  # `docker compose --profile backup run --rm backup backup-now` (or `restore ...`).
  # Dev credentials match the db/minio values above so it can reach both locally.
  backup:
    profiles: ["backup"]
    build: ./deploy/backup
    environment:
      POSTGRES_PASSWORD: learny
      MINIO_ROOT_USER: learny
      MINIO_ROOT_PASSWORD: learny-dev-secret
    volumes:
      - backup_data:/backups
      - wal_archive:/wal_archive
      # Where restore-pitr.sh stages a recovered cluster for db-restore to serve.
      - pitr_data:/pitr

volumes:
  backup_data:
