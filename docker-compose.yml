# Learny service topology (FR-SCAF-001, AD-008/AD-042).
# Six services: api, web, db (postgres+pgvector), redis, worker (Celery), minio.
# Health: db/redis/minio via native checks; api via /healthz; worker via celery ping.
#
# This base file is the single source of topology truth and is deliberately kept
# free of host-published infra ports and of secrets:
#   - Local dev: `docker-compose.override.yml` (auto-loaded) adds db/redis/minio
#     host ports and dev credentials.
#   - Production: `docker-compose.prod.yml` (explicit `-f`) adds restart policies,
#     pinned images, prod env, and env_file-injected secrets (NFR-SEC-003).
# So `docker compose up` stays a local dev run; `docker compose -f docker-compose.yml
# -f docker-compose.prod.yml up -d` is the production-like run.

services:
  # Built from ./deploy/postgres — a thin pgvector/pgvector:pg16 derivative that
  # exists only to create the WAL-archive directory owned by the database user
  # (so a fresh named volume is writable without a host-side chown) and to ship a
  # pg_hba.conf that admits remote physical replication for pg_basebackup. See the
  # Dockerfile there for why each is needed.
  db:
    build:
      context: ./deploy/postgres
      dockerfile: Dockerfile
    environment:
      POSTGRES_USER: learny
      POSTGRES_DB: learny
      # POSTGRES_PASSWORD comes from the override (local) or env_file (prod).
    # Continuous WAL archiving (the base of point-in-time recovery). archive_mode is
    # postmaster-level, so changing it needs a database restart — see docs/ops/backups.md.
    # The archive_command refuses to overwrite an existing segment: `test ! -f` fails,
    # the command exits non-zero, and PostgreSQL RETAINS the segment and retries rather
    # than silently overwriting it and corrupting the replay chain.
    command:
      - postgres
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
      - -c
      - archive_mode=on
      - -c
      - archive_command=test ! -f /wal_archive/%f && cp %p /wal_archive/%f
      - -c
      - archive_timeout=${LEARNY_WAL_ARCHIVE_TIMEOUT:-900}
    volumes:
      - db_data:/var/lib/postgresql/data
      # Deliberately NOT inside db_data: the archive exists to recover the very data
      # directory it would otherwise be lost with. The backup sidecar mounts the same
      # volume and owns all offsite shipping and pruning, so no S3 client and no
      # backup credential ever enters the database container.
      - wal_archive:/wal_archive
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learny -d learny"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Point-in-time recovery target. Profile-gated, so it is never part of a plain
  # `docker compose up`; it exists to serve the data directory `restore-pitr.sh`
  # stages in the backup sidecar. It runs the SAME image as `db` on purpose — the
  # cluster being replayed was written by these binaries and these extensions, and
  # a server without pgvector would start happily and then fail on the first read
  # of a vector column.
  db-restore:
    profiles: ["restore"]
    build:
      context: ./deploy/postgres
      dockerfile: Dockerfile
    environment:
      POSTGRES_USER: learny
      POSTGRES_DB: learny
      # The staged cluster, not the live data volume.
      PGDATA: /pitr/data
    # archive_mode=off: this server promotes onto a new timeline when it reaches the
    # target, and a promoted restore must not write its timeline back into the
    # archive the live database owns. The archive is mounted read-only for the same
    # reason — restore_command only ever reads it.
    command:
      - postgres
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
      - -c
      - archive_mode=off
    volumes:
      - pitr_data:/pitr
      - wal_archive:/wal_archive:ro
    # Deliberately stricter than `pg_isready`, which answers yes throughout
    # recovery: a server still replaying — or paused at its target — accepts reads
    # and refuses writes, which is a FAILED restore that looks like a healthy one.
    # `--wait` on this healthcheck is what turns that into a visible failure.
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -q -U learny -d learny && psql -U learny -d learny -tAc 'SELECT NOT pg_is_in_recovery()' | grep -qx t
      interval: 5s
      timeout: 10s
      retries: 60

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    # MINIO_ROOT_USER/PASSWORD come from the override (local) or env_file (prod).
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      LEARNY_REDIS_URL: redis://redis:6379/0
      LEARNY_SESSION_COOKIE_SECURE: "false"
      LEARNY_STORAGE_ENDPOINT: http://minio:9000
      LEARNY_STORAGE_BUCKET: learny-sources
      LEARNY_STORAGE_REGION: us-east-1
      # LEARNY_DATABASE_URL + storage access/secret keys come from the override
      # (local) or env_file (prod) — never inline in this base (NFR-SEC-003).
    # Apply migrations, then serve.
    command: >-
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      LEARNY_REDIS_URL: redis://redis:6379/0
      LEARNY_STORAGE_ENDPOINT: http://minio:9000
      LEARNY_STORAGE_BUCKET: learny-sources
      LEARNY_STORAGE_REGION: us-east-1
      # LEARNY_DATABASE_URL + storage access/secret keys come from the override
      # (local) or env_file (prod) — never inline in this base (NFR-SEC-003).
    # Explicit `--queues celery` (the default queue) so this worker never drains
    # ingest-pdf — that queue belongs to worker-pdf alone (ING-18).
    command: celery -A app.worker.celery_app:celery_app worker --loglevel=info --queues celery
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD", "celery", "-A", "app.worker.celery_app:celery_app", "inspect", "ping"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 20s

  # Isolated PDF ingestion worker (ING-18). Docling parsing is CPU/memory heavy
  # (minutes per book), so it consumes only the dedicated ingest-pdf queue with a
  # single concurrent task, a memory cap, and one task per child process — a
  # pathological PDF cannot starve or crash EPUB ingestion, embedding, or the API.
  # Built from the pdf-worker image target (docling + baked models); the default
  # worker image stays docling-free.
  worker-pdf:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: pdf-worker
    environment:
      LEARNY_REDIS_URL: redis://redis:6379/0
      LEARNY_STORAGE_ENDPOINT: http://minio:9000
      LEARNY_STORAGE_BUCKET: learny-sources
      LEARNY_STORAGE_REGION: us-east-1
      # LEARNY_DATABASE_URL + storage access/secret keys come from the override
      # (local) or env_file (prod) — never inline in this base (NFR-SEC-003).
    command: celery -A app.worker.celery_app:celery_app worker --loglevel=info --queues ingest-pdf --concurrency 1 --max-tasks-per-child 1
    mem_limit: 4g
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD", "celery", "-A", "app.worker.celery_app:celery_app", "inspect", "ping"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 20s

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      LEARNY_API_BASE_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    # node:slim has no curl; Node >=20 ships global fetch, so probe with node (Gap-1).
    healthcheck:
      test:
        ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  db_data:
  minio_data:
  wal_archive:
  # Staging area for a point-in-time restore: written by the backup sidecar, served
  # by db-restore. Separate from db_data so a restore can never overwrite the live
  # database, and so a rehearsal costs nothing but disk.
  pitr_data:
